[project]
name = "stemlab"
version = "0.1.0"
description = "Local-first Windows music source separation application"
requires-python = ">=3.12,<3.13"
dependencies = [
  "audio-separator==0.47.0",
  # audio-separator imports this directly but 0.47.0 does not declare it.
  "audioread==3.1.0",
  "PySide6-Essentials==6.9.2",
  "sounddevice==0.5.6",
  "torch==2.8.0",
  "transformers==5.18.0",
]

[project.optional-dependencies]
cpu = ["audio-separator[cpu]==0.47.0", "onnxruntime==1.26.0"]
# ORT GPU 1.27+ defaults to CUDA 13; preserve the validated CUDA 12.8 build.
gpu = ["audio-separator[gpu]==0.47.0", "onnxruntime-gpu==1.26.0"]

[dependency-groups]
dev = [
  "pytest==9.1.1",
]

# The CUDA build is deliberately installed from requirements-gpu.txt, whose
# direct wheel URL and hash select the validated cu128 Windows artifact.

[project.scripts]
stemlab = "stemlab.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
  "integration: opt-in tests that run the existing GPU model",
]
